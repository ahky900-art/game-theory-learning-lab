<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMEN582 · Game Theory Exam Lab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
:root{--bg:#f6f7f9;--fg:#20242b;--mut:#68717d;--card:#fff;--bd:#dfe3e8;--pri:#244f9e;--soft:#edf2fb;--ok:#eaf6ef;--warn:#fff5df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 system-ui,-apple-system,"Malgun Gothic",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:14px 22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}header h1{font-size:17px;margin:0}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;cursor:pointer}nav button,.btn,.nav-link{border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);padding:7px 13px;text-decoration:none;display:inline-block}nav button.active,.btn.primary{background:var(--pri);border-color:var(--pri);color:white}
#app{max-width:1280px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}@media(max-width:800px){.grid{grid-template-columns:1fr}aside{position:static!important}}
aside{position:sticky;top:82px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}aside button{width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:7px;color:var(--fg)}aside button.active{background:var(--soft);color:var(--pri);font-weight:700}
.panel,.doc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px 24px;min-width:0}.doc h1{font-size:23px}.doc h2{font-size:19px;border-bottom:1px solid var(--bd);padding-bottom:5px;margin-top:1.8em}.doc h3{font-size:16px;margin-top:1.5em}.doc table{border-collapse:collapse;display:block;overflow-x:auto}.doc th,.doc td{border:1px solid var(--bd);padding:7px 10px;vertical-align:top}.doc th{background:#f0f2f5}.doc blockquote{margin:12px 0;padding:10px 14px;background:#f2f4f7;border-left:4px solid var(--pri)}.doc code{background:#f1f3f6;padding:2px 4px;border-radius:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted,.hint{color:var(--mut);font-size:13px}.tag{display:inline-block;background:var(--soft);color:var(--pri);padding:3px 9px;border-radius:30px;font-size:12px}.mode{display:flex;gap:8px;margin:14px 0}.mode button.active{background:var(--pri);color:white}.math{overflow-x:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:15px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}.stat b{font-size:25px;display:block}.opt{display:block;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--bd);border-radius:9px;background:white;margin:8px 0}.opt.correct{background:var(--ok);border-color:#4b9b68}.opt.wrong{background:#fff0f0;border-color:#c85b5b}.feedback{padding:12px;border-radius:9px;margin:12px 0;background:var(--soft)}textarea{width:100%;min-height:125px;border:1px solid var(--bd);border-radius:8px;padding:12px;font:inherit}.progress{height:9px;background:#e9edf2;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--pri)}.qtitle{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.timer{font:700 23px ui-monospace,monospace}.check{display:block;margin:8px 0}.check input{margin-right:7px}.warning{background:var(--warn);padding:12px;border-radius:8px}.hide{display:none}

/* Q1(b) visual workflow */
.workflow{display:grid;justify-items:stretch;gap:8px;margin:16px 0 22px}
.workflow-step{display:grid;gap:6px;padding:14px 16px;border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:10px;background:#f8faff}
.workflow-step strong{color:var(--pri);font-size:15px}
.workflow-step span{display:block;padding-left:4px}
.workflow-arrow{text-align:center;color:var(--pri);font-size:24px;line-height:1.15;font-weight:700}
@media(min-width:760px){.workflow{max-width:850px}.workflow-step{padding:16px 20px}}
/* Reliable math layout: display equations stay readable on narrow screens. */
.formula-panel{display:grid;gap:10px;background:#f7f9fc;border:1px solid var(--bd);border-radius:10px;padding:14px;overflow-x:auto}
.formula-line{min-height:34px;padding:5px 2px;overflow-x:auto}
.formula-line .katex-display{margin:.35em 0;text-align:left}
.formula-caption,.equation-caption{color:var(--mut);font-size:14px;padding:5px 2px}
.doc .katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:5px 0}
.doc .katex{font-size:1.06em}
.doc p:has(>.katex-display){overflow-x:auto}
@media(max-width:600px){.panel,.doc{padding:15px}.formula-panel{padding:10px}.doc .katex{font-size:1em}}
</style></head>
<body>
<header><h1>IMEN582 · Game Theory Exam Lab</h1><nav>
<button class="active" data-tab="learn">문제별 학습</button><button data-tab="phrase">영문 판독 훈련</button><button data-tab="blind">블라인드 풀이</button><button data-tab="dashboard">학습 현황</button><a class="nav-link" href="./s2d2/">드론 방어 · S2D2</a>
</nav></header><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="app.js"></script></body></html>
